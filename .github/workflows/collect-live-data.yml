name: Collect live data
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Collect now, retaining odds-request cache and rate limits'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: live-data-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      ODDS_REGIONS: ${{ vars.ODDS_REGIONS || 'uk' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-runtime.lock.txt
      - run: pip install -r requirements-runtime.lock.txt
        working-directory: backend
      - name: Validate production configuration
        working-directory: backend
        run: python -c "from app.runtime import Runtime; Runtime.load(); print('Production configuration valid')"
      - name: Collect due observations and results
        working-directory: backend
        env:
          FORCE_COLLECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "$FORCE_COLLECTION" = "true" ]; then
            python scripts/collect_live_data.py --force
          else
            python scripts/collect_live_data.py
          fi
